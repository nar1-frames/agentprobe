# AgentProbe scan of the LangChain quickstart agent through the python target:
# the scanner imports agent.py and calls answer() once per attack, with no
# server. agentprobe-security and the agent's dependencies must be installed in
# the same environment. From the repository root:
#   GROQ_API_KEY=... agentprobe scan --non-interactive --verbose \
#     --config examples/langchain-quickstart-agent/agentprobe.python.yaml
# The target label and settings match agentprobe.yaml (the http target), so a
# recording made through either path replays the other's requests.

target:
  provider: python
  model: langchain-quickstart-agent   # report label; the agent runs openai/gpt-oss-20b
  strength_rank: 1
  python:
    callable: "agent:answer"          # imported from this folder (cwd defaults to it)

judge:
  provider: groq
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  strength_rank: 2
  timeout_seconds: 60
  max_tokens: 120
  temperature: 0.1
  reasoning_effort: low

scan:
  categories: all
  severity_filter: null
  rate_limit_seconds: 5
  retries: 0
  retry_delay_seconds: 0
  record_replay_path: reports/quickstart-python.replay.json

output:
  report_dir: reports
  report_format: both
