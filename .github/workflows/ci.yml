name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tracked test suite
        run: pytest -q tests
      - name: Run offline harness smoke test
        run: python -m agentprobe.cli harness --mode guarded --fail-on-success
      - name: Validate checked-in research artifacts
        run: python -m research.validate
      - name: Check tracked public repository surface
        run: python -m research.public_hygiene --include-untracked
      - name: Recompute and export research tables
        run: |
          python -m research.analyze --primary ren --json /tmp/agentprobe-results.json
          python -m research.export --results /tmp/agentprobe-results.json --out /tmp/agentprobe-results.md
      - name: Compile Python modules
        run: python -m compileall -q agentprobe attacks disclosure research agentprobe_v11.py agentprobe_v12.py
