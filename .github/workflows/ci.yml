name: AgentProbe CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run offline harness smoke test
        run: python -m agentprobe.cli harness --mode guarded --fail-on-success

      - name: Compile supported entry points
        run: python -m compileall -q agentprobe attacks disclosure research agentprobe_v11.py agentprobe_v12.py

      - name: Check public-tree hygiene
        run: python -m research.public_hygiene

      - name: Build and audit public wheel
        run: |
          mkdir -p /tmp/agentprobe-wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/agentprobe-wheel .
          python -m research.public_hygiene --wheel /tmp/agentprobe-wheel/*.whl
