name: Pages

# Publishes site/ to GitHub Pages, with the sample report copied in at
# sample-report/ and the sample retest at sample-retest/. Pages must be enabled
# with "GitHub Actions" as the source (repository Settings, then Pages).
# Until Pages is enabled, the deploy job is skipped, so nothing is published
# and the run stays green.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/sample-report/**"
      - "examples/sample-retest/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/sample-report _site/sample-retest
          cp site/index.html _site/
          cp examples/sample-report/sample-report.html examples/sample-report/sample-report.pdf \
            _site/sample-report/
          cp examples/sample-retest/sample-retest.html examples/sample-retest/sample-retest.pdf \
            _site/sample-retest/

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the artifact
      id-token: write  # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
